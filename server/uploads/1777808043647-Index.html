                appState.currentPage = page;

                    appState.selectedItem = appState.items.find(item => item.id === params.itemId);
                }
                renderApp();
            }

            // Authentication functions
            function login(email, password) {
                const user = appState.users.find(u => u.email === email && u.password === password);
                if (user) {
                    appState.isLoggedIn = true;
                    appState.currentUser = user;
                    appState.isAdmin = user.isAdmin;
                    navigateTo('dashboard');
                    return true;
                }
                return false;
            }

            function signup(name, email, password) {
                if (appState.users.some(u => u.email === email)) {
                    return false;
                }
                
                const newUser = {
                    id: appState.users.length + 1,
                    name,
                    email,
                    password,
                    isAdmin: false,
                    points: 100,
                    items: [],
                    swaps: []
                };
                
                appState.users.push(newUser);
                appState.isLoggedIn = true;
                appState.currentUser = newUser;
                navigateTo('dashboard');
                return true;
            }

            function logout() {
                appState.isLoggedIn = false;
                appState.currentUser = null;
                appState.isAdmin = false;
                navigateTo('landing');
            }

            // Item functions
            function addItem(item) {
                const newItem = {
                    ...item,
                    id: appState.items.length + appState.pendingItems.length + 1,
                    uploader: {
                        id: appState.currentUser.id,
                        name: appState.currentUser.name,
                        rating: 4.5,
                        points: appState.currentUser.points
                    },
                    status: appState.isAdmin ? 'available' : 'pending'
                };
                
                if (appState.isAdmin) {
                    appState.items.push(newItem);
                    appState.currentUser.items.push(newItem.id);
                } else {
                    appState.pendingItems.push(newItem);
                }
                
                navigateTo('dashboard');
            }

            function approveItem(itemId) {
                const itemIndex = appState.pendingItems.findIndex(item => item.id === itemId);
                if (itemIndex !== -1) {
                    const item = appState.pendingItems[itemIndex];
                    item.status = 'available';
                    appState.items.push(item);
                    appState.pendingItems.splice(itemIndex, 1);
                    
                    const uploader = appState.users.find(u => u.id === item.uploader.id);
                    if (uploader) {
                        uploader.items.push(item.id);
                    }
                }
                renderApp();
            }

            function rejectItem(itemId) {
                const itemIndex = appState.pendingItems.findIndex(item => item.id === itemId);
                if (itemIndex !== -1) {
                    appState.pendingItems.splice(itemIndex, 1);
                }
                renderApp();
            }

                navigateTo('dashboard');

                const item = appState.items.find(i => i.id === itemId);
                if (item && appState.currentUser.points >= 100) {

                    alert('Item redeemed successfully! The owner will ship it to you.');
                    navigateTo('dashboard');
                } else {
